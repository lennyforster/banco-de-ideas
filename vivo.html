<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Post-it compartido</title>
<meta name="theme-color" content="#1f6b4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--mat:#1f6b4a;--mat-minor:rgba(190,235,190,.22);--mat-major:rgba(210,245,200,.5);--ink:#2b2520;--muted:#5b4a3a;--paper:#fffdf6;
  --hand:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--ui:"Instrument Sans",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font-family:var(--ui);background-color:var(--mat);
  background-image:linear-gradient(var(--mat-major) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--mat-major) 1.5px,transparent 1.5px),linear-gradient(var(--mat-minor) 1px,transparent 1px),linear-gradient(90deg,var(--mat-minor) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 40px}
.barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:720px;margin:0 auto 22px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,253,246,.94);border-radius:999px;padding:8px 14px;font:600 .85rem var(--ui);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.punto{width:8px;height:8px;border-radius:50%;background:#bbb}.pill.vivo .punto{background:#1f9d6b;box-shadow:0 0 0 3px rgba(31,157,107,.25)}.pill.error .punto{background:#d64545}
.gente{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.persona{display:inline-flex;align-items:center;gap:6px;background:rgba(255,253,246,.94);border-radius:999px;padding:5px 11px 5px 6px;font:600 .8rem var(--ui);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.persona i{width:18px;height:18px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font:700 10px var(--ui);font-style:normal}
.postit{position:relative;max-width:720px;margin:0 auto;background:#ffe76a;padding:34px 30px 30px;transform:rotate(-.6deg);
  box-shadow:0 2px 2px rgba(0,0,0,.12),0 26px 40px -16px rgba(0,0,0,.55);background-image:linear-gradient(170deg,rgba(255,255,255,.4),transparent 35%)}
.postit::before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:26px;transform:translateX(-50%) rotate(1.5deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.meta{display:flex;justify-content:space-between;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:rgba(43,37,32,.6);margin-bottom:10px}
textarea{display:block;width:100%;min-height:260px;resize:none;overflow:hidden;border:0;background:transparent;color:var(--ink);font:700 24px/1.35 var(--hand);padding:0;outline:none}
textarea::placeholder{color:rgba(43,37,32,.4)}
.vivo-cursores{position:absolute;inset:0;pointer-events:none}
.vivo-caret{position:absolute;width:2px;background:var(--c);border-radius:1px}
.vivo-caret span{position:absolute;left:0;top:-17px;white-space:nowrap;background:var(--c);color:#fff;font:600 10px/16px var(--ui);padding:0 6px;border-radius:4px 4px 4px 0}
.ayuda{max-width:720px;margin:18px auto 0;color:rgba(255,253,246,.85);font:500 .85rem/1.45 var(--ui);text-align:center}
.nombre{position:fixed;inset:0;background:rgba(20,14,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.nombre[hidden]{display:none}
.nombre form{background:#fbf7ec;border-radius:12px;padding:22px;width:min(360px,100%);display:grid;gap:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.nombre h1{margin:0;font:700 1.35rem var(--hand)}.nombre p{margin:0;color:var(--muted);font-size:.9rem}
.nombre input{font:500 1rem var(--ui);padding:11px 12px;border-radius:8px;border:1px solid rgba(43,37,32,.25);background:#fff}
.nombre button{border:0;border-radius:999px;padding:11px;background:var(--ink);color:var(--paper);font:600 .95rem var(--ui);cursor:pointer}
.error-box{max-width:720px;margin:40px auto;background:#fbf7ec;border-radius:12px;padding:22px;font:500 1rem/1.5 var(--ui)}
</style>
</head>
<body>
<div class="barra"><span class="pill" id="estado"><span class="punto"></span><span id="estado-t">Conectando…</span></span><div class="gente" id="gente"></div></div>
<div class="postit" id="postit"><div class="meta"><span id="tit">Post-it compartido</span><span>En vivo</span></div><textarea id="t" placeholder="Escribí acá. Todos ven lo mismo en el momento." aria-label="Texto del post-it compartido" disabled></textarea></div>
<p class="ayuda">Lo que escribís acá lo ven al instante todos los que tienen este link. Se guarda solo.</p>
<div class="nombre" id="nombre" hidden><form id="f-nombre"><h1>¿Cómo te llamás?</h1><p>Así los demás saben quién está escribiendo.</p><input id="i-nombre" maxlength="30" autocomplete="nickname" placeholder="Tu nombre"><button type="submit">Entrar</button></form></div>
<script type="module">
import { conectar, colorDe } from "./vivo.js";
const $ = id => document.getElementById(id), id = (location.hash || "").slice(1).trim();
const ta = $("t"), autosize = () => { ta.style.height = "auto"; ta.style.height = Math.max(260, ta.scrollHeight) + "px"; };
const LS = { get: k => { try { return localStorage.getItem(k) } catch (_) { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch (_) { } } };
function estado(t, c) { $("estado-t").textContent = t; $("estado").className = "pill " + (c || ""); }
function gente(lista) { $("gente").replaceChildren(...lista.map(p => { const s = document.createElement("span"); s.className = "persona"; const i = document.createElement("i"); i.style.setProperty("--c", p.color); i.textContent = (p.nombre || "?").trim().charAt(0).toUpperCase(); s.append(i, p.nombre); return s })) }
async function arrancar(nombre) {
  if (!/^[a-z0-9]{20,}$/.test(id)) { document.body.innerHTML = '<div class="error-box">Este link no está completo. Pedile a quien te lo pasó que te lo mande de nuevo.</div>'; return }
  try {
    const c = await conectar({ id, textarea: ta, nombre, capa: $("postit"), onTexto: () => autosize(), onGente: l => { gente(l); estado(l.length ? "En vivo · " + (l.length + 1) + " personas" : "En vivo", "vivo") } });
    if (c.titulo) $("tit").textContent = c.titulo;
    ta.disabled = false; ta.addEventListener("input", autosize); autosize(); estado("En vivo", "vivo"); ta.focus();
    addEventListener("offline", () => estado("Sin conexión", "error")); addEventListener("online", () => estado("En vivo", "vivo"));
  } catch (e) { console.error(e); estado("No se pudo conectar", "error"); if (String(e.message).includes("no existe")) document.querySelector(".ayuda").textContent = "Este post-it ya no está compartido."; }
}
const n = LS.get("vivo_nombre");
if (n) arrancar(n);
else { $("nombre").hidden = false; $("i-nombre").focus(); $("f-nombre").onsubmit = e => { e.preventDefault(); const v = $("i-nombre").value.trim(); if (!v) return; LS.set("vivo_nombre", v); $("nombre").hidden = true; arrancar(v) } }
</script>
</body>
</html>
